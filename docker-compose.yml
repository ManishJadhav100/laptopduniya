version: '3.8'

services:
  backend:
    build: ./backend
    command: bash -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn laptop_duniya.wsgi -b 0.0.0.0:8000"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - ./backend:/app # Mount local backend for sqlite persistence if used, or use volume
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=194.163.162.240,localhost,laptopduniya.in,www.laptopduniya.in,backend
      - NEXT_PUBLIC_API_URL=https://laptopduniya.in/api/v1
    restart: always

  frontend:
    build: 
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=https://laptopduniya.in/api/v1
    environment:
      - NEXT_PUBLIC_API_URL=https://laptopduniya.in/api/v1
      - INTERNAL_API_URL=http://laptopduniya.in/api/v1
    ports:
      - "3000:3000"
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    networks:
      default:
        aliases:
          - laptopduniya.in
          - www.laptopduniya.in
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - backend
      - frontend
    restart: always

volumes:
  static_volume:
  media_volume:
